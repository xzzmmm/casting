<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageMind 排练记录助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>StageMind</h1>
    <nav>
      <button data-view="upload" class="nav-btn active">上传处理</button>
      <button data-view="timeline" class="nav-btn">排练时间轴</button>
      <button data-view="blocking" class="nav-btn">台位动线</button>
      <button data-view="issues" class="nav-btn">问题看板</button>
      <button data-view="search" class="nav-btn">检索</button>
    </nav>
  </header>

  <main id="view" class="view"></main>

  <script src="js/api.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/blocking.js"></script>
  <script src="js/issues.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
